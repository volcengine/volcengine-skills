name: release-core-skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag and repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${package_version}" >&2
            exit 1
          fi
          python3 scripts/sync_plugins.py --check
          python3 scripts/validate_codex_plugin_layout.py
          python3 -m unittest discover -s tests -v

      - name: Build core Skill release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          version="${RELEASE_TAG#v}"
          public_base="${TOS_PUBLIC_BASE_URL:-https://cloudcache.volccdn.com}"
          prefix="${TOS_PREFIX:-ve/skills}"
          python3 scripts/build_release_bundle.py \
            --version "$version" \
            --cdn-base-url "${public_base%/}/${prefix#/}" \
            --output-dir dist

      - name: Publish GitHub release fallback
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/manifest.json
            dist/volcengine-skill-bundle.zip

      - name: Install tosutil
        run: |
          curl --fail --location --retry 5 \
            https://github.com/volcengine/tosutil/releases/download/v4.1.2/tosutil-linux-amd64.zip \
            --output "$RUNNER_TEMP/tosutil.zip"
          echo '40bbb4636b0182715b9832310463be7ba58f9b1db26a7aa008cd2e873e5c9310  '"$RUNNER_TEMP/tosutil.zip" \
            | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/tosutil.zip" -d "$RUNNER_TEMP/tosutil"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/tosutil/tosutil-linux-amd64/tosutil" "$RUNNER_TEMP/bin/tosutil"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Configure TOS credentials
        env:
          TOS_ENDPOINT: ${{ vars.TOS_ENDPOINT }}
          TOS_REGION: ${{ vars.TOS_REGION }}
        run: |
          endpoint="${TOS_ENDPOINT:-https://tos-cn-beijing.volces.com}"
          region="${TOS_REGION:-cn-beijing}"
          tosutil config \
            -i='${{ secrets.TOS_AK }}' \
            -k='${{ secrets.TOS_SK }}' \
            -e="$endpoint" \
            -re="$region"

      - name: Upload versioned release to TOS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TOS_BUCKET: ${{ vars.TOS_BUCKET }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          version="${RELEASE_TAG#v}"
          bucket="${TOS_BUCKET:-eps-common-public}"
          prefix="${TOS_PREFIX:-ve/skills}"
          tosutil cp \
            dist/volcengine-skill-bundle.zip \
            "tos://${bucket}/${prefix}/v${version}/volcengine-skill-bundle.zip"
          tosutil cp \
            dist/cdn-manifest.json \
            "tos://${bucket}/${prefix}/v${version}/manifest.json" \
            -contentType=application/json

      - name: Verify public versioned release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          version="${RELEASE_TAG#v}"
          public_base="${TOS_PUBLIC_BASE_URL:-https://cloudcache.volccdn.com}"
          prefix="${TOS_PREFIX:-ve/skills}"
          release_base="${public_base%/}/${prefix#/}/v${version}"
          curl --fail --location --retry 5 "$release_base/manifest.json" -o published-manifest.json
          curl --fail --location --retry 5 "$release_base/volcengine-skill-bundle.zip" -o published-bundle.zip
          python3 - <<'PY'
          import hashlib
          import json
          expected = json.load(open("published-manifest.json"))["bundle"]["sha256"]
          actual = hashlib.sha256(open("published-bundle.zip", "rb").read()).hexdigest()
          if actual != expected:
              raise SystemExit("published bundle sha256 mismatch")
          PY

      - name: Publish latest manifest last
        env:
          TOS_BUCKET: ${{ vars.TOS_BUCKET }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          bucket="${TOS_BUCKET:-eps-common-public}"
          prefix="${TOS_PREFIX:-ve/skills}"
          tosutil cp \
            dist/cdn-manifest.json \
            "tos://${bucket}/${prefix}/latest/manifest.json" \
            -contentType=application/json \
            -cacheControl='no-cache, max-age=0'
